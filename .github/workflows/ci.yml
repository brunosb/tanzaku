name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Recover publication for an existing release tag (vX.Y.Z); leave empty for CI only'
        required: false
        type: string

permissions:
  contents: read

env:
  HUSKY: '0'
  RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'github-actions[bot]' && github.head_ref == 'release-please--branches--main--components--tanzaku' }}

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release_tag || 'validate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_pr: ${{ steps.classify.outputs.release_pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate PR title with Commitlint
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint -- --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate manually dispatched branch commits
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: npm run commitlint -- --from origin/main --to HEAD --verbose
      - name: Validate latest main commit on manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: npm run commitlint -- --last --verbose
      - name: Classify and restrict Release Please changes
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node tools/ci/classify-release-pr.cjs
      - name: Validate release metadata
        if: env.RELEASE_PR == 'true'
        run: |
          npm run check
          npm run check:version
          npm run check:installer-template
      - name: Static checks, runtime audit tests and renderer suite
        if: env.RELEASE_PR != 'true'
        run: npm run test:node

  rust:
    name: rust (windows)
    if: >-
      (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'github-actions[bot]' && github.head_ref == 'release-please--branches--main--components--tanzaku')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run test:rust

  release-installer:
    name: release installer (windows)
    needs: [checks]
    if: >-
      github.event_name == 'pull_request' &&
      needs.checks.result == 'success' &&
      needs.checks.outputs.release_pr == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node tools/checks/check-version.cjs "v$version"
      - run: npm run tauri:build
      - run: npm run test:installer
      - name: Verify fresh install and in-place update
        env:
          CI: 'true'
          TAURI_INSTALLER_CI_SMOKE: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-install-modes.ps1
      - name: Prepare release artifact and provenance manifest
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:RELEASE_TAG = "v$version"
          node tools/release/create-installer-manifest.cjs $env:PR_HEAD_SHA $env:PR_NUMBER src-tauri/target/release-artifact
      - name: Upload validated installer for tag promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tanzaku-release-installer-${{ github.event.pull_request.head.sha }}
          path: src-tauri/target/release-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Save installer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics-${{ github.event.pull_request.head.sha }}
          path: src-tauri/target/smoke/
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: validate
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    needs: [checks, rust, release-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the expected validation jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          RUST: ${{ needs.rust.result }}
          RELEASE_INSTALLER: ${{ needs.release-installer.result }}
          RELEASE_PR: ${{ needs.checks.outputs.release_pr }}
        run: |
          echo "checks=$CHECKS rust=$RUST release-installer=$RELEASE_INSTALLER release-pr=$RELEASE_PR"
          [ "$CHECKS" = success ] || { echo '::error::checks did not succeed'; exit 1; }
          if [ "$RELEASE_PR" = true ]; then
            [ "$RUST" = skipped ] || [ "$RUST" = success ] || { echo '::error::unexpected Rust job result'; exit 1; }
            [ "$RELEASE_INSTALLER" = success ] || { echo '::error::release installer validation did not succeed'; exit 1; }
          else
            [ "$RUST" = success ] || { echo '::error::Windows Rust tests did not succeed'; exit 1; }
            [ "$RELEASE_INSTALLER" = skipped ] || { echo '::error::unexpected release installer job'; exit 1; }
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: promote validated installer
    needs: [release]
    if: needs.release.result == 'success' && needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve the successful Release Please PR artifact
        id: resolve
        run: node tools/release/resolve-installer-run.cjs "$RELEASE_TAG"
      - name: Download the exact validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: src-tauri/target/release-artifact
      - name: Verify provenance and installer bytes against the tag
        env:
          SOURCE_HEAD_SHA: ${{ steps.resolve.outputs.source_head_sha }}
          RELEASE_PULL_REQUEST: ${{ steps.resolve.outputs.pull_request }}
        run: node tools/release/verify-installer-manifest.cjs "$RELEASE_TAG" src-tauri/target/release-artifact "$SOURCE_HEAD_SHA" "$RELEASE_PULL_REQUEST"
      - name: Stage verified installer for release upload
        run: |
          New-Item -ItemType Directory -Force src-tauri/target/release/bundle/nsis | Out-Null
          Copy-Item src-tauri/target/release-artifact/Tanzaku_*_x64-setup.exe src-tauri/target/release/bundle/nsis/
        shell: pwsh
      - run: node tools/release/publish.cjs "$RELEASE_TAG"

  recovery-build:
    name: rebuild existing tag (windows)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag format
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[\w.-]+)?$') {
            throw "Invalid release tag: '$env:RELEASE_TAG'"
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: node tools/checks/check-version.cjs "$env:RELEASE_TAG"
      - run: npm test
      - run: npm run tauri:build
      - run: npm run test:installer
      - name: Verify fresh install and in-place update
        env:
          CI: 'true'
          TAURI_INSTALLER_CI_SMOKE: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-install-modes.ps1
      - name: Prepare recovery artifact
        shell: pwsh
        run: node tools/release/create-installer-manifest.cjs - - src-tauri/target/recovery-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tanzaku-release-recovery-${{ inputs.release_tag }}
          path: src-tauri/target/recovery-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  recovery-publish:
    name: publish recovered installer
    needs: [recovery-build]
    if: always() && needs.recovery-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tanzaku-release-recovery-${{ inputs.release_tag }}
          path: src-tauri/target/recovery-artifact
      - name: Verify recovery artifact against the tag
        run: node tools/release/verify-installer-manifest.cjs "$RELEASE_TAG" src-tauri/target/recovery-artifact
      - name: Stage verified installer for release upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/target/release/bundle/nsis | Out-Null
          Copy-Item src-tauri/target/recovery-artifact/Tanzaku_*_x64-setup.exe src-tauri/target/release/bundle/nsis/
      - run: node tools/release/publish.cjs "$RELEASE_TAG"
