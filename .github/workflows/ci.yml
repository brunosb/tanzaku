name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry publication of an existing release tag (vX.Y.Z); leave empty for CI only'
        required: false
        type: string

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release_tag || 'validate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ${{ ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--'))) && 'ubuntu-latest' || 'windows-2022' }}
    timeout-minutes: 45
    env:
      LIGHTWEIGHT: ${{ ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--'))) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: ${{ env.LIGHTWEIGHT != 'true' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        if: env.LIGHTWEIGHT != 'true'
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: env.LIGHTWEIGHT != 'true'
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate PR title with Commitlint
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $env:PR_TITLE | npm run commitlint -- --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$env:BASE_SHA" --to "$env:HEAD_SHA" --verbose
      - name: Validate manually dispatched branch commits
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: npm run commitlint -- --from origin/main --to HEAD --verbose
      - name: Validate latest main commit on manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: npm run commitlint -- --last --verbose
      - name: Validate release metadata and formatting
        if: env.LIGHTWEIGHT == 'true'
        run: |
          npm run check
          npm run check:version
          npm run check:installer-template
      - name: Run full test suite
        if: env.LIGHTWEIGHT != 'true'
        run: npm test
      - name: Build Windows installer
        if: env.LIGHTWEIGHT != 'true'
        run: npm run tauri:build
      - name: Smoke test installed app
        if: env.LIGHTWEIGHT != 'true'
        run: npm run test:installer
      - name: Verify fresh install and in-place upgrade
        if: env.LIGHTWEIGHT != 'true'
        env:
          CI: 'true'
          TAURI_INSTALLER_CI_SMOKE: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-install-modes.ps1
      - name: Save installer and desktop diagnostics
        if: always() && runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/smoke/
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    if: >-
      always() &&
      ((needs.release.result == 'success' && needs.release.outputs.created == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''))
    needs: [release]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: node tools/checks/check-version.cjs "$env:RELEASE_TAG"
      - run: npm run tauri:build
      - run: npm run test:installer
      - name: Verify fresh install and in-place upgrade
        env:
          CI: 'true'
          TAURI_INSTALLER_CI_SMOKE: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify-install-modes.ps1
      - run: node tools/release/publish.cjs "$env:RELEASE_TAG"
      - name: Save release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: src-tauri/target/smoke/
