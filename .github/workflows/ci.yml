name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry publication of an existing release tag (vX.Y.Z); leave empty for CI only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release_tag || 'validate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e "if(!/^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([^)]+\))?!?: .+/.test(process.env.PR_TITLE))process.exit(1)"
      - run: npm test
      - run: npm run tauri:build
      - run: npm run test:installer
      - name: Save installer and desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/smoke/
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Start CI for release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          echo "$RELEASE_PRS" | jq -r '.[].headBranchName' | while IFS= read -r branch; do
            gh workflow run ci.yml --ref "$branch"
          done

  publish:
    if: >-
      always() && needs.validate.result == 'success' &&
      ((needs.release.result == 'success' && needs.release.outputs.created == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''))
    needs: [validate, release]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: node tools/checks/check-version.cjs "$env:RELEASE_TAG"
      - run: npm run tauri:build
      - run: npm run test:installer
      - run: node tools/release/publish.cjs "$env:RELEASE_TAG"
      - name: Save release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: src-tauri/target/smoke/
