<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tanzaku Tauri Experiment</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #080b0d; color: #f5f7f8; }
        main { width: min(560px, calc(100% - 48px)); padding: 32px; border: 1px solid #2b353a; border-radius: 14px; background: #12171a; }
        h1 { margin-top: 0; color: #f5c451; }
        p { color: #aab5ba; line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <h1>Tanzaku + Tauri</h1>
        <p>Shell experimental carregado. Esta tela valida a comunicação entre a interface e o backend Rust.</p>
        <p id="runtime">Consultando runtime...</p>
    </main>
    <script>
        const { invoke } = window.__TAURI__.core
        invoke('runtime_info').then((value) => {
            document.querySelector('#runtime').textContent = value
        }).catch((error) => {
            document.querySelector('#runtime').textContent = `Falha: ${error}`
        })
    </script>
</body>
</html>
