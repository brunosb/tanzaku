[package]
name = "tanzaku-tauri-experiment"
version = "1.0.1"
description = "Tanzaku Tauri experiment"
authors = ["Tanzaku contributors"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "tanzaku_tauri_experiment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
hound = "3.5"
ndarray = "0.17"
midly = "0.5"
ort = { version = "2.0.0-rc.14", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "load-dynamic",
    "api-31",
] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
tempfile = "3"
